# End-to-end tests for sejaltech994/coaching-centre-fee-app.
#  - "E2E (local stack)": checks out the app, starts its API (fresh in-memory
#    database, console SMS whose log supplies the OTPs) and the built web app,
#    then runs every scenario.
#  - "Smoke (dev site)": nightly, the browser scenarios that need no API run
#    against the live dev site, including its security headers.
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *" # 06:30 IST
  workflow_dispatch:
    inputs:
      app_ref:
        description: App repo branch, tag or SHA to test (blank = same-named branch, else develop)
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-stack:
    name: E2E (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the matching browser: `playwright install --with-deps`
    # on a plain runner once spent over 10 minutes installing system packages.
    # Keep the tag equal to @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:8787/api/v1
      OTP_LOG_FILE: /tmp/chukta-api.log
    steps:
      - uses: actions/checkout@v7
      # Run-on-demand input first; else a same-named branch in the app repo (so
      # feature/x here tests feature/x there); else develop.
      - name: Pick the app branch
        id: app-ref
        env:
          INPUT_REF: ${{ inputs.app_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads https://github.com/sejaltech994/coaching-centre-fee-app "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=develop" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: sejaltech994/coaching-centre-fee-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: app
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install and build the app
        working-directory: app
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          npm ci
          npm run build -w apps/web

      - name: Start the API (embedded database, console SMS)
        working-directory: app/apps/api
        env:
          NODE_ENV: development
          PORT: "8787"
          DATABASE_URL: pglite:memory
          JWT_SECRET: e2e-only-secret-not-used-anywhere-else-0123456789
          SMS_PROVIDER: console
          WEB_ORIGINS: ${{ env.WEB_URL }}
          # Every scenario logs in from the same IP; the TSD's 20/hour would cap the suite.
          OTP_PER_IP_PER_HOUR: "1000"
        run: nohup npx tsx src/server.ts > "$OTP_LOG_FILE" 2>&1 &

      - name: Serve the web app
        run: nohup node app/scripts/serve-static.mjs app/apps/web/out 3000 > /tmp/chukta-web.log 2>&1 &

      - name: Wait for both
        run: |
          node -e '
            const wait = async (url) => {
              for (let i = 0; i < 60; i++) {
                try { if ((await fetch(url)).ok) return; } catch {}
                await new Promise((r) => setTimeout(r, 1000));
              }
              console.error(`Timed out waiting for ${url}`);
              process.exit(1);
            };
            (async () => { for (const url of process.argv.slice(1)) await wait(url); })();
          ' "$API_URL/health" "$WEB_URL/"

      - run: npm ci
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-local-stack
          path: |
            playwright-report/
            test-results/
            /tmp/chukta-api.log
            /tmp/chukta-web.log
          retention-days: 14
          if-no-files-found: ignore

  dev-site:
    name: Smoke (dev site)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WEB_URL: https://chukta-web-dev.chukta.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No API is hosted yet, so only browser scenarios run (journeys skip themselves).
      - run: npx bddgen && npx playwright test --project=desktop --project=mobile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-dev-site
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
